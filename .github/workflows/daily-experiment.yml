name: Daily 365 Web Graphics Lab

on:
  schedule:
    # GitHub Actions cron is UTC. 22:00 UTC = 07:00 JST the next day.
    - cron: '0 22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-web-graphics-lab
  cancel-in-progress: false

jobs:
  generate-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.1' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate today's experiment
        run: node scripts/generate-daily-experiment.mjs

      - name: Validate content
        run: pnpm test:content

      - name: Validate Daily Lab
        run: node scripts/validate-daily-experiments.mjs

      - name: Production build
        run: pnpm build

      - name: Commit only after all tests pass
        shell: bash
        run: |
          git add content/articles
          if git diff --cached --quiet; then
            echo "No new article to commit."
            exit 0
          fi

          git config user.name "daily-web-graphics-bot"
          git config user.email "actions@users.noreply.github.com"
          DATE_JST="$(TZ=Asia/Tokyo date +%F)"
          git commit -m "daily: publish experiment ${DATE_JST}"
          git push origin HEAD:main
